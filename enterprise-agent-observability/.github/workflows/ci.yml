name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-evaluate:
    runs-on: ubuntu-latest
    env:
      LLM_PROVIDER: mock
      OPIK_ENABLED: "false"
      LOG_FORMAT: text
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[api,dev]"
      - name: Lint
        run: ruff check src tests
      - name: Unit & agent behaviour tests
        run: pytest -q
      - name: Evaluation quality gate (fails build on regression)
        run: agentctl eval --mode local
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-report
          path: reports/*.json

  # Optional: run the Opik experiment against a real model on main (needs repo secrets)
  opik-experiment:
    if: github.ref == 'refs/heads/main' && vars.RUN_OPIK_EXPERIMENT == 'true'
    needs: test-and-evaluate
    runs-on: ubuntu-latest
    env:
      LLM_PROVIDER: openai
      LLM_MODEL: gpt-4o-mini
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPIK_ENABLED: "true"
      OPIK_USE_LOCAL: "false"
      OPIK_API_KEY: ${{ secrets.OPIK_API_KEY }}
      OPIK_WORKSPACE: ${{ vars.OPIK_WORKSPACE }}
      EVAL_USE_LLM_JUDGE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: agentctl eval --mode opik --experiment "ci-${{ github.sha }}"
